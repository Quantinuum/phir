[build-system]
requires = ["setuptools>=77", "setuptools_scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phir"
description = "A data model and validation tool for PHIR (PECOS High-level Intermediate Representation)."
readme = "README.md"
requires-python = ">=3.12"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
  { name = "Kartik Singhal", email = "kartik.singhal@quantinuum.com" },
  { name = "Ciarán Ryan-Anderson", email = "ciaran.ryan-anderson@quantinuum.com" },
]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dynamic = ["version"]
dependencies = [
  "pydantic>=2.14.1,<2.15.0",
  "rich>=14.2,<15.1",
]

[dependency-groups]
dev = [
  "autodoc-pydantic==2.2.0",
  "pre-commit==4.7.0",
  "pydata-sphinx-theme==0.23.0",
  "pytest==9.1.1",
  "sphinx~=9.1.1",
]

[project.scripts]
phir-cli = "phir.cli:main"

[project.urls]
Changelog = "https://github.com/quantinuum/phir/blob/main/CHANGELOG.md"
Documentation = "https://quantinuum.github.io/phir/"
Repository = "https://github.com/quantinuum/phir"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
"phir" = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools_scm]
version_scheme = "python-simplified-semver"
